services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pennyvoice
      POSTGRES_USER: pennyvoice
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pennyvoice-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pennyvoice -d pennyvoice"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pennyvoice-postgres:
