spring.application.name=pennyvoice
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pennyvoice}
spring.datasource.username=${DATABASE_USERNAME:pennyvoice}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=5000
spring.mvc.problemdetails.enabled=true
pennyvoice.jwt-secret=${PENNYVOICE_JWT_SECRET}
pennyvoice.cookie-secure=${COOKIE_SECURE:true}
spring.jackson.deserialization.accept-float-as-int=false
